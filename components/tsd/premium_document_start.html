<style>
    .premium-document-wrapper {
        max-width: 800px;
        margin: 4rem auto;
        background: var(--background-main);
        padding: 4rem 5rem;
        border-radius: 8px;
        box-shadow: var(--shadow-2xl);
        border: 1px solid var(--border-color);
        font-family: var(--font-body);
        color: var(--text-color-main);
        position: relative;
    }
    .premium-header-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 12px;
        background: var(--primary-color);
        border-top-left-radius: 8px;
        border-top-right-radius: 8px;
    }
    .premium-logo {
        height: 40px;
        margin-bottom: 2rem;
    }
    .premium-print-btn {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        background: var(--gold-accent);
        color: white;
        padding: 1rem 1.5rem;
        border-radius: 50px;
        font-weight: bold;
        box-shadow: var(--shadow-lg);
        cursor: pointer;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        border: none;
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .premium-print-btn:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-xl);
    }
    
    /* Typography Overrides */
    .premium-document-wrapper h1, .premium-document-wrapper .markdown-content h1 {
        font-family: var(--font-heading);
        color: var(--primary-color);
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
    }
    .premium-document-wrapper h2, .premium-document-wrapper .markdown-content h2 {
        font-family: var(--font-heading);
        color: var(--primary-color);
        font-size: 1.8rem;
        margin-top: 2.5rem;
        margin-bottom: 1rem;
        border-bottom: 2px solid var(--gold-accent);
        padding-bottom: 0.5rem;
    }
    .premium-document-wrapper h3, .premium-document-wrapper .markdown-content h3 {
        color: var(--gold-accent);
        margin-top: 2rem;
    }
    .premium-document-wrapper hr, .premium-document-wrapper .markdown-content hr {
        border-color: var(--gold-accent);
        margin: 2rem 0;
        opacity: 0.3;
    }
    .premium-document-wrapper input[type="checkbox"], .premium-document-wrapper .markdown-content input[type="checkbox"] {
        accent-color: var(--gold-accent);
        transform: scale(1.2);
        margin-right: 0.5rem;
    }
</style>

</button>
