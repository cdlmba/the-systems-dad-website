<section id="hero" class="hero-section">
    <div class="main-container">
        <div class="hero-split-layout">
            <div class="hero-text-container">
                <h1 class="hero-title">{{hero_copy_title}}</h1>
                <p class="hero-subtitle" style="font-size: 1.25rem;">
                    {{hero_copy_subtitle}}
                </p>
                <div class="cta-group">
                    <a href="https://marginreset.com/residue-audit" class="cta-button cta-button-primary" style="margin-bottom: 0.5rem;">{{hero_copy_cta_primary}}</a>
                    <a href="/stewardship-briefing" class="cta-button cta-button-secondary" style="margin-bottom: 0.5rem;">{{hero_copy_cta_secondary}} →</a>
                    <p style="font-size: 0.85rem; color: var(--text-color-muted); font-style: italic; width: 100%; margin-top: 0.5rem;">{{hero_copy_cta_note}}</p>
                </div>
            </div>
            <div class="hero-image-container">
                <img src="/images/ChristopherLynnHeadshot_v2.jpg" 
                     alt="Christopher Lynn" 
                     class="hero-image" 
                     width="600" 
                     height="800" 
                     fetchpriority="high">
            </div>
        </div>
    </div>
</section>

{{client_logos}}
